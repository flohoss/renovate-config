name: renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # 15:00 CEST (summer), 14:00 CET (winter)

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          app-id: ${{ vars.RENOVATE_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: 'docker-compose,stacks'

      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ steps.get_token.outputs.token }}
          configurationFile: ${{ github.workspace }}/config.js
        env:
          RENOVATE_USERNAME: ${{ vars.RENOVATE_BOT_USERNAME }}
          RENOVATE_AUTHOR: ${{ vars.RENOVATE_BOT_USERNAME }}
          RENOVATE_PRIVATE_EMAIL: ${{ vars.RENOVATE_APP_ID }}+${{ vars.RENOVATE_BOT_USERNAME }}@users.noreply.github.com
          RENOVATE_DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          RENOVATE_DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          RENOVATE_GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          RENOVATE_GHCR_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_NTFY_URL: ${{ vars.NTFY_URL }}
          RENOVATE_NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
